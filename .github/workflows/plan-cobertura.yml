name: Validar plan de cobertura
on:
  pull_request:
    paths:
      - 'crecimiento-colombia/**'
      - '.github/workflows/plan-cobertura.yml'
      - 'backend/app/CoverageService.php'
      - 'backend/app/analytics/**'
      - 'backend/app/content/coverage-*.json'
      - 'backend/tests/coverage*'
      - 'scripts/generar-catalogo-cobertura.py'
  push:
    paths:
      - 'crecimiento-colombia/**'
      - '.github/workflows/plan-cobertura.yml'
      - 'backend/app/CoverageService.php'
      - 'backend/app/analytics/**'
      - 'backend/app/content/coverage-*.json'
      - 'backend/tests/coverage*'
      - 'scripts/generar-catalogo-cobertura.py'
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 crecimiento-colombia/scripts/validar.py
      - run: python3 crecimiento-colombia/scripts/test_validar.py
      - run: python3 crecimiento-colombia/scripts/operacion.py --report
      - run: python3 crecimiento-colombia/scripts/test_operacion.py
      - run: python3 crecimiento-colombia/scripts/test_turismo.py
      - run: python3 crecimiento-colombia/scripts/test_alcance.py
      - run: python3 crecimiento-colombia/scripts/turismo.py --report
      - name: Verificar catálogo y cálculo de cobertura
        run: |
          python3 scripts/generar-catalogo-cobertura.py
          php backend/tests/coverage-service.php
          php backend/tests/coverage-scope.php
          php backend/tests/analytics-service.php
          python3 backend/tests/test_coverage_package.py
          git diff --exit-code -- backend/app/content/coverage-plan.json
      - name: Comprobar reportes actualizados
        run: git diff --exit-code -- crecimiento-colombia/cobertura-operativa.json crecimiento-colombia/COBERTURA_OPERATIVA.md crecimiento-colombia/ORDEN_TURISTICO.md

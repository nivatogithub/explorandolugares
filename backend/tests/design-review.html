<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Revisión local del diseño</title><style>body{margin:0;padding:16px;background:#fffaf2;color:#172b42;font:14px system-ui}.frames{display:flex;gap:20px}section{width:390px}h2{font-size:16px}iframe{display:block;width:390px;height:844px;border:1px solid #f2c77e;border-radius:12px;background:#fffaf2;box-sizing:content-box}</style></head><body><p>Revisión local · tres vistas de 390 px · datos de prueba</p><div class="frames"><section><h2>Cobertura móvil</h2><iframe title="Cobertura móvil" src="/cobertura/colombia/?departamento=05#cobertura"></iframe></section><section><h2>Audiencia móvil</h2><iframe title="Audiencia móvil" src="/cobertura/colombia/?departamento=05#audiencia"></iframe></section><section><h2>Haz parte móvil</h2><iframe title="Haz parte móvil" src="/cobertura/colombia/?departamento=05#participar"></iframe></section></div><button type="button" id="refresh-design" style="margin-top:16px">Actualizar revisión</button><pre id="design-report" style="white-space:pre-wrap"></pre><script>
function inspectDesign(){const reports=[...document.querySelectorAll('iframe')].map(f=>{try{const w=f.contentWindow,d=f.contentDocument;const bg=s=>w.getComputedStyle(d.querySelector(s)).backgroundColor;return {view:f.title,width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,panel:bg('.audience'),card:bg('.audience-metrics article'),action:bg('.coverage-tabs button[aria-selected=true]'),pauta:bg('.join'),field:bg('#invite-message'),columns:w.getComputedStyle(d.querySelector('.audience-metrics')).gridTemplateColumns,totalHeight:d.documentElement.scrollHeight,contentHeight:d.querySelector('main').getBoundingClientRect().height,heroHeight:d.querySelector('.coverage-intro').getBoundingClientRect().height,panelHeight:d.querySelector('[role=tabpanel]:not([hidden])').getBoundingClientRect().height,mapHeight:d.querySelector('.map').getBoundingClientRect().height,cardsHeight:d.querySelector('.country-stats').getBoundingClientRect().height};}catch{return {view:f.title,status:'loading'};}});document.getElementById('design-report').textContent=JSON.stringify(reports,null,2);}
document.getElementById('refresh-design').addEventListener('click',inspectDesign);window.addEventListener('load',inspectDesign);
</script></body></html>
